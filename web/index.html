<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preload" href="data.json" as="fetch" crossorigin>
<script>
  // Apply a chosen theme before first paint, so a dark viewer never sees a light flash.
  try { var t = localStorage.getItem("triage.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>

<div id="app" class="tri"></div>
<noscript>This viewer needs JavaScript. The data is in <a href="data.json">data.json</a>.</noscript>
