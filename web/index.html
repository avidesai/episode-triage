<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triage</title>
<meta name="description" content="A triage inbox for a robot fleet: every failure sorted by who should fix it, with its evidence attached.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232457c5'/%3E%3Cpath d='M4 5h8M4 8h5M4 11h7' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="data.json" as="fetch" crossorigin>
<script>
  // Apply a saved theme before first paint so there is no flash.
  try { var t = localStorage.getItem("triage.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>

<div id="app"></div>
<noscript>This viewer needs JavaScript. The data is in <a href="data.json">data.json</a>.</noscript>

</html>
